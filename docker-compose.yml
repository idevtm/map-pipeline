services:
  martin:
    build:
      context: ./docker/martin
    image: map-pipeline-martin:local
    container_name: ${MARTIN_CONTAINER_NAME:-map-pipeline-martin}
    command:
      - --config
      - /etc/martin/config.yaml
      - --webui
      - "${MARTIN_WEBUI:-enable-for-all}"
    ports:
      - "${MARTIN_PORT:-3000}:3000"
    restart: unless-stopped
    user: "65534:65534"
    volumes:
      - ./data/martin/config.yaml:/etc/martin/config.yaml:ro
      - ./data:/data:ro
